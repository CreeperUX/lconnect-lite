[package]
name = "lcl-app"
description = "LConnect Lite 图形界面；只通过命名管道和 lcl-daemon 通信，不直接碰设备"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lcl_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lcl-core = { workspace = true, features = ["nvml"] }
lcl-effects.workspace = true
lcl-media = { path = "../../crates/lcl-media" }
serde.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
